        var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

        var seen = false;
        if (!team && ONCE_PER_SESSION && !replay) { try { seen = sessionStorage.getItem(KEY) === '1'; } catch (e) {} }
        function remove() { if (el && el.parentNode) el.parentNode.removeChild(el); el = null; root.classList.remove('az-lock'); }
        function exit() { if (!el || leaving) return; leaving = true; el.classList.add('az-out'); setTimeout(remove, EXIT); }
        function show() {
          if (!el || shown || ready) return;
          shown = true;
          el.classList.add('az-on');
          root.classList.add('az-lock');
          if (!team) { try { sessionStorage.setItem(KEY, '1'); } catch (e) {} }

        window.__azLoader = {
          ready: function () {
            if (ready) return;
            ready = true;

          },
          message: function (text) { var m = el && el.querySelector('.azl-msg'); if (m) m.textContent = text || ''; },
          replay: dev ? function () { try { sessionStorage.removeItem(KEY); } catch (e) {} location.search = '?loader'; } : undefined
        };
        if (!el) return;
        if (seen) remove(); else timer = setTimeout(show, replay ? 0 : DELAY);
